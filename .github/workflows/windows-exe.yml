name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "requirements.txt"
      - "requirements-build.txt"
      - ".github/workflows/windows-exe.yml"
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU inference and app dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt huggingface_hub pyinstaller
      - name: Build standalone executable
        run: |
          pyinstaller --noconfirm --clean --onefile --name HackerCoderAI --collect-all llama_cpp --collect-all uvicorn --collect-all fastapi app/desktop.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: HackerCoderAI-Windows
          path: dist/HackerCoderAI.exe
          if-no-files-found: error
